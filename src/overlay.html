<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;">
<title>Pitwall radio</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* the radio overlay: a see-through window over the game, the radio graphic scaled to the window's width */
  html, body { background: transparent !important; margin: 0; overflow: hidden; height: 100%; }
  body { user-select: none; }
  #wrap { position: absolute; left: 0; top: 0; width: 330px; transform-origin: top left; padding: 10px; box-sizing: border-box; }
  #wrap .eng-radio { position: static; width: auto; pointer-events: none; --bga: 0.95; --txa: 1;
    background: linear-gradient(180deg, rgba(14, 22, 52, var(--bga)), rgba(6, 10, 28, var(--bga))); box-shadow: 0 10px 34px rgba(0, 0, 0, calc(var(--bga) * 0.55)); }
  /* the text's opacity (the slider in Settings): names, number, bars, logo and the words */
  #wrap .eng-radio > * { opacity: var(--txa); }
  /* the words: as many lines as the window's height allows, moved on in jumps when there are more */
  #wrap .er-text { overflow: hidden; position: relative; transition: height 0.18s ease-out; }
  #wrap .er-spacer { display: block; }
  #wrap .er-caret { display: inline; }
  /* no gap between what you said and the reply (their colours tell them apart), so every jump lands on whole lines */
  #wrap .er-text .er-me { margin-bottom: 0; }
  /* moving it: the whole window drags, its edges size it, and a frame shows where it is */
  body.edit { -webkit-app-region: drag; outline: 2px dashed #F5A623; outline-offset: -2px; background: rgba(10, 14, 30, 0.35) !important; }
  #edit { display: none; position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); -webkit-app-region: no-drag; gap: 8px; align-items: center; white-space: nowrap;
    font: 600 12px "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(0, 0, 0, 0.7); padding: 6px 10px; border-radius: 6px; }
  body.edit #edit { display: flex; }
  #edit button { font: 700 12px "Segoe UI", system-ui, sans-serif; background: #F5A623; color: #15151E; border: 0; border-radius: 4px; padding: 4px 12px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"><div id="radio" class="eng-radio" aria-live="polite"></div></div>
<div id="edit"><span>Drag to move · drag the edges to resize</span><button id="done">Done</button></div>
<script>
'use strict';
const radio = document.getElementById('radio'), wrap = document.getElementById('wrap');
let hideT = null, writeT = null, editing = false, maxLines = 4;
// the graphic is as wide as the window; the words grow downward line by line, up to the longest message set in Settings
// (and what the window's height allows), then move on in smooth single scrolls
const scale = () => Math.max(0.35, window.innerWidth / 330);
const textBox = () => radio.querySelector('.er-text');
const lineH = () => { const el = radio.querySelector('.er-eng, .er-me'); if (!el) return 22; const cs = getComputedStyle(el); return parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.15 || 22; };
const V = { maxH: 88, h: 0, top: 0, anim: null }; // the box's limit and height, and where its scroll is headed
function fit() {
  const sc = scale(); wrap.style.transform = `scale(${sc})`;
  const T = textBox(); if (!T) return;
  const room = (window.innerHeight - (editing ? 48 : 0)) / sc - 20; // the window's height in the graphic's own pixels, less #wrap's padding
  const kept = T.style.height; T.style.transition = 'none'; T.style.height = '0px'; const rest = radio.offsetHeight; T.style.height = kept; void T.offsetHeight; T.style.transition = '';
  const L = lineH(); V.maxH = Math.max(1, Math.min(maxLines, Math.floor((room - rest) / L))) * L; // whole lines, never one cut in half
  T.querySelector('.er-spacer').style.height = V.maxH + 'px';
  if (editing) V.h = V.maxH; size();
}
const size = () => { const T = textBox(); if (T) T.style.height = Math.min(V.h, V.maxH) + 'px'; };
// one smooth movement to a scroll position (a newer target takes over from wherever it's got to)
function glide(to) {
  const T = textBox(); if (!T) return; V.top = to; cancelAnimationFrame(V.anim);
  const from = T.scrollTop, t0 = performance.now(), D = 420; if (Math.abs(to - from) < 1) { T.scrollTop = to; return; }
  const step = (now) => { const k = Math.min(1, (now - t0) / D); const e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2; T.scrollTop = from + (to - from) * e; if (k < 1) V.anim = requestAnimationFrame(step); };
  V.anim = requestAnimationFrame(step);
}
// as the words are written: the box grows to the line being written; once that runs past the limit, one scroll on by a
// whole box of lines, or only as far as shows the rest of the message if that's less
function follow() {
  const T = textBox(); const C = T?.querySelector('.er-caret'); if (!T || !C) return;
  const L = lineH(); const bottom = (Math.round(C.offsetTop / L) + 1) * L; /* the bottom of the line being written, snapped to the line grid */ const page = Math.max(L, Math.floor(V.maxH / L) * L);
  if (bottom - V.top > V.maxH + L / 2) { const last = [...T.querySelectorAll('[data-full]')].pop(); const end = last.offsetTop + last.offsetHeight - V.maxH; glide(Math.max(V.top + L, Math.min(end, V.top + page))); }
  const want = Math.min(V.maxH, bottom - V.top); if (want > V.h) { V.h = want; size(); }
}
window.addEventListener('resize', fit); fit();
// the opacity of the background and the text, and the longest message, from Settings
const style = (st) => { if (!st) return; if (st.bg != null) radio.style.setProperty('--bga', st.bg); if (st.text != null) radio.style.setProperty('--txa', st.text); if (st.lines != null && st.lines !== maxLines) { maxLines = st.lines; fit(); follow(); } };
const SAMPLE = { html: '<div class="er-head"><span class="er-name">YOUR NAME</span><span class="er-radio">RADIO</span></div><div class="er-mid"><span class="er-num">1</span><span class="er-bars">' + Array.from({ length: 18 }, (_, k) => `<i style="animation-delay:-${(k * 137 % 600) / 1000}s;animation-duration:${0.35 + (k * 53 % 40) / 100}s"></i>`).join('') + '</span><span class="er-logo"></span></div><div class="er-me" data-full="“WHAT’S THE GAP TO THE CAR AHEAD?”"></div><div class="er-eng" data-full="“1.2 AHEAD. YOU ARE CLOSING IN, 0.3 A LAP.”"></div>', tc: '#3A8DFF', dur: 3 };
const esc = (x) => x.replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
// a part written up to n characters: the rest is laid out already but unseen, so the lines never shift as it writes
const put = (el, full, n, on) => { el.innerHTML = esc(full.slice(0, n)) + (on ? '<i class="er-caret"></i>' : '') + '<span style="visibility:hidden">' + esc(full.slice(n)) + '</span>'; };
let plan = [], k = 0;
// the same write-on as in the app: what you said first (quickly), then the engineer across the time the line takes to say.
// A new message while the graphic is still up carries on in it: what's left of the last one is written out, the new
// one goes underneath, and the box scrolls so the new message starts at the very top.
function show(p, stay) {
  const T0 = textBox(); const more = !stay && !editing && radio.classList.contains('on') && T0;
  const tmp = document.createElement('div'); tmp.innerHTML = p.html; const parts = [...tmp.querySelectorAll('[data-full]')];
  clearInterval(writeT); radio.style.setProperty('--tc', p.tc || '#3A8DFF');
  let T;
  if (more) {
    T = T0; for (const P of plan.slice(k)) put(P.el, P.full, P.full.length, false);
    const sp = T.querySelector('.er-spacer'); parts.forEach(el => T.insertBefore(el, sp));
  } else {
    cancelAnimationFrame(V.anim); radio.innerHTML = p.html; [...radio.querySelectorAll('[data-full]')].forEach((el, j) => { parts[j] = el; });
    T = document.createElement('div'); T.className = 'er-text'; parts[0]?.before(T); parts.forEach(el => T.appendChild(el));
    const sp = document.createElement('i'); sp.className = 'er-spacer'; T.appendChild(sp); // room below, so a new message can always scroll to the top
    V.h = 0; V.top = 0;
  }
  radio.classList.add('on', 'talking');
  parts.forEach((el, j) => put(el, el.dataset.full, 0, j === 0)); fit();
  if (more) glide(parts[0].offsetTop); else T.scrollTop = 0;
  if (!V.h) { V.h = lineH(); size(); }
  plan = parts.map(el => ({ el, full: el.dataset.full, n: 0, per: el.classList.contains('er-me') ? 40 : Math.max(18, el.dataset.full.length / Math.max(0.8, (p.dur || 3) * 0.95)) })); k = 0;
  let last = performance.now();
  writeT = setInterval(() => { const now = performance.now(), dt = (now - last) / 1000; last = now; const P = plan[k]; if (!P) { clearInterval(writeT); radio.classList.remove('talking'); return; }
    P.n = Math.min(P.full.length, P.n + P.per * dt);
    if (P.n >= P.full.length) { k++; put(P.el, P.full, P.full.length, false); if (plan[k]) put(plan[k].el, plan[k].full, 0, true); } else put(P.el, P.full, Math.floor(P.n), true);
    follow(); }, 30);
  clearTimeout(hideT); if (!stay) hideT = setTimeout(() => { if (!editing) radio.classList.remove('on', 'talking'); }, ((p.dur || 3) + 6) * 1000);
}
window.overlay?.onShow((p) => { style(p.style); show(p, editing); });
window.overlay?.onStyle(style);
window.overlay?.onEdit((on) => { editing = on; fit(); document.body.classList.toggle('edit', on); if (on) show(SAMPLE, true); else { radio.classList.remove('on', 'talking'); clearInterval(writeT); } });
document.getElementById('done').addEventListener('click', () => window.overlay?.done());
</script>
</body>
</html>
